plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.javamodularity.moduleplugin' version '2.1.0'
    id 'io.github.ben-manes.versions' version '0.64.0'
    id 'org.beryx.jlink' version '4.1.1'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.ysb33r.cloudci' version '4.0.1'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'io.miret.etienne.sass' version '1.6.0'
    id "com.ryandens.javaagent-test" version "0.12.2"
}

group = 'com.github.mfl28'
version = '3.1.0'

def currentYear = Calendar.getInstance().get(Calendar.YEAR)

repositories {
    mavenCentral()
}

dependencies {
    // Junit (Unit testing)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TestFx UI TesTing // https://mvnrepository.com/artifact/org.testfx/testfx-junit5
    testImplementation('org.testfx:testfx-junit5:4.0.18') {
        exclude group: 'org.hamcrest'
    }

    // https://mvnrepository.com/artifact/nl.jqno.equalsverifier/equalsverifier
    testImplementation 'nl.jqno.equalsverifier:equalsverifier:3.19.4'

    // Hamcrest https://mvnrepository.com/artifact/org.hamcrest/hamcrest
    testImplementation 'org.hamcrest:hamcrest:3.0'

    // Mockito (inline mock maker is the default since 5.0) https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation 'org.mockito:mockito-core:5.24.0'

    // Mockito-Junit https://mvnrepository.com/artifact/org.mockito/mockito-junit-jupiter
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'

    testJavaagent "net.bytebuddy:byte-buddy-agent:1.18.14"

    // Commons Collections https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation 'org.apache.commons:commons-collections4:4.4'

    // Commons Lang https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation 'commons-io:commons-io:2.17.0'

    // ControlsFX https://mvnrepository.com/artifact/org.controlsfx/controlsfx
    implementation('org.controlsfx:controlsfx:11.2.1') {
        exclude group: 'org.openjfx'
    }

    // Caffeine https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Gradle plugin to use the error-prone compiler https://github.com/tbroyer/gradle-errorprone-plugin
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    // Google GSON https://github.com/google/gson
    implementation 'com.google.code.gson:gson:2.11.0'

    // Jersey REST client https://mvnrepository.com/artifact/org.glassfish.jersey.core/jersey-client
    implementation 'org.glassfish.jersey.core:jersey-client:3.1.9'

    // HK2 InjectionManager https://mvnrepository.com/artifact/org.glassfish.jersey.inject/jersey-hk2
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.9'

    // Jersey Multipart https://mvnrepository.com/artifact/org.glassfish.jersey.media/jersey-media-multipart
    implementation 'org.glassfish.jersey.media:jersey-media-multipart:3.1.9'

    // Jaxb runtime https://mvnrepository.com/artifact/org.glassfish.jaxb/jaxb-runtime
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'

    // Mimepull https://mvnrepository.com/artifact/org.jvnet.mimepull/mimepull
    implementation 'org.jvnet.mimepull:mimepull:1.10.0'

    // Xml bind https://mvnrepository.com/artifact/jakarta.xml.bind/jakarta.xml.bind-api
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'

    // https://mvnrepository.com/artifact/jakarta.ws.rs/jakarta.ws.rs-api
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'

    // https://mvnrepository.com/artifact/org.locationtech.jts/jts-core
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // https://mvnrepository.com/artifact/com.drewnoakes/metadata-extractor
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
    
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-csv
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv:2.18.3'
}

javafx {
    version = '27'
    modules = ['javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.swing']
}

test {
    useJUnitPlatform()

    jvmArgs = ['-Dtestfx.robot=awt', '-Dprism.forceGPU=true']
    maxHeapSize = '3072m'
    // Tests get their own, in-memory preferences instead of reading and changing the user's.
    systemProperty 'java.util.prefs.PreferencesFactory', 'com.github.mfl28.boundingboxeditor.InMemoryPreferencesFactory'
    // TestFX moves the mouse in one step per pixel (at most 200), each followed by a short sleep. Fewer steps make
    // every robot move considerably faster; the tests only depend on the start and end points.
    systemProperty 'testfx.robot.move_max_count', '20'

    moduleOptions {
        runOnClasspath = true
    }

    finalizedBy jacocoTestReport
}

ci {
    githubactions {
        test {
            systemProperty "fullScreenTests", false
            jvmArgs = ['-Dprism.verbose=true', '-Djava.net.preferIPv6Addresses=system']

            if(org.gradle.internal.os.OperatingSystem.current().macOsX) {
                // Currently there is no support for running UI tests on macOS in a VM via github-actions.
                useJUnitPlatform {
                    excludeTags 'ui'
                }
            }
        }
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def isNonStable = { String version ->
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  def regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version)
  }
}

compileSass {
    outputDir = layout.buildDirectory.file ("resources/main/stylesheets/css").get().asFile
    destPath = "."
    sourceDir = project.file ("${projectDir}/src/main/resources/stylesheets/scss")
    style = expanded
    noCharset ()
    noErrorCss ()
    sourceMap = none
}

compileJava {
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-requires-automatic'])
}

compileTestJava {
    dependsOn compileSass

    moduleOptions {
        // jdk.httpserver: a local HTTP server standing in for inference servers in tests.
        addModules = ['org.mockito.junit.jupiter', 'jdk.httpserver']
        addReads = ['com.github.mfl28.boundingboxeditor': 'org.mockito.junit.jupiter,jdk.httpserver']
    }
}

jar {
    dependsOn compileSass
    from compileSass.outputDir
}

application {
    mainModule = "com.github.mfl28.boundingboxeditor"
    mainClass = "com.github.mfl28.boundingboxeditor.BoundingBoxEditorApp"
    applicationDefaultJvmArgs = ['-Dprism.forceGPU=true', '-Djava.net.preferIPv6Addresses=system',
                                 '--enable-native-access=javafx.graphics']
}

java {
    modularity.inferModulePath = false
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'BoundingBoxEditor'
        // JavaFX loads its native libraries, which the JDK only allows with a warning (to be blocked later) unless
        // native access is enabled for the module.
        jvmArgs = ['-Dprism.forceGPU=true', '-Djava.net.preferIPv6Addresses=system',
                   '--enable-native-access=javafx.graphics']
    }

    forceMerge 'jakarta'

    mergedModule {
        additive = true
        // The plugin derives the merged module's requires from the JDK's jmods, which JDK 24+ builds (e.g. Temurin 25)
        // no longer ship ("Cannot find module exporting ..."), so the JDK modules are listed here. Without them the
        // packaged app can't create the REST client (IllegalAccessError: the merged module does not read java.logging).
        // Found with jdeps; javassist's hot-swap agent (java.instrument, jdk.attach, jdk.jdi) is never used.
        requires 'java.logging'
        requires 'java.desktop'
        uses 'jakarta.ws.rs.client.ClientBuilder'
        uses 'jakarta.ws.rs.ext.RuntimeDelegate'
    }

    imageZip = layout.buildDirectory.file("distributions/boundingboxeditor-${javafx.platform.classifier}.zip")

    jpackage {
        installerOptions.addAll([
                '--app-version', version.toString(),
                '--copyright', "Copyright ${currentYear}, Markus Fleischhacker".toString(),
                '--description', 'Graphical image annotation application',
                '--license-file', 'LICENSE',
                '--vendor', 'Markus Fleischhacker',
        ])

        if(org.gradle.internal.os.OperatingSystem.current().windows) {
            installerOptions.addAll([
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-menu-group', 'Bounding Box Editor',
                    '--win-shortcut'
            ])
            icon = 'src/main/resources/icons/app_icon.ico'
            installerType = 'exe'
        } else if(org.gradle.internal.os.OperatingSystem.current().linux) {
            installerOptions.addAll([
                    '--resource-dir', 'build/jpackage/BoundingBoxEditor/lib',
                    '--linux-shortcut',
                    '--linux-menu-group', 'Graphics',
                    '--linux-deb-maintainer', 'markus.fleischhacker28@gmail.com'
            ])
            icon = 'src/main/resources/icons/app_icon.png'
        } else if(org.gradle.internal.os.OperatingSystem.current().macOsX) {
            icon = 'src/main/resources/icons/app_icon.icns'
        }

        // Allow to pass installer type as command line parameter:
        if(project.hasProperty('installerType')) {
            installerType = project.property('installerType')
        }
    }
}

// A smoke test of the packaged app, run with the Java runtime of the jlink image (see src/smokeTest). It covers what
// only breaks there, like missing module declarations of the merged module, which the tests (run on the classpath)
// can't notice.
def smokeTestSources = fileTree('src/smokeTest/java') { include '**/*.java' }
def smokeTestClassesDir = layout.buildDirectory.dir('smokeTest/classes')
def smokeTestExports = ['model.io', 'model.io.results', 'model.io.restclients'].collect {
    "--add-exports=com.github.mfl28.boundingboxeditor/com.github.mfl28.boundingboxeditor.${it}=smoketest".toString()
}

tasks.register('compilePackagedAppSmokeTest', Exec) {
    description = 'Compiles the smoke test of the packaged app against the modules of the jlink image.'
    dependsOn 'jlink'
    inputs.files smokeTestSources
    outputs.dir smokeTestClassesDir
    def javac = javaToolchains.compilerFor(java.toolchain).map { it.executablePath.asFile.absolutePath }
    doFirst {
        executable javac.get()
    }
    args(['--module-path', layout.buildDirectory.dir('jlinkbase/jlinkjars').get().asFile.absolutePath,
          '-d', smokeTestClassesDir.get().asFile.absolutePath] + smokeTestExports)
    argumentProviders.add({ smokeTestSources.files*.absolutePath } as CommandLineArgumentProvider)
}

tasks.register('packagedAppSmokeTest', Exec) {
    group = 'verification'
    description = 'Runs the smoke test of the packaged app with the Java runtime of the jlink image.'
    dependsOn 'compilePackagedAppSmokeTest'
    def javaExecutable = org.gradle.internal.os.OperatingSystem.current().windows ? 'java.exe' : 'java'
    executable layout.buildDirectory.file("image/bin/${javaExecutable}").get().asFile.absolutePath
    args(['--module-path', smokeTestClassesDir.get().asFile.absolutePath] + smokeTestExports
            + ['--module', 'smoketest/smoketest.PackagedAppSmokeTest'])
}

tasks.register('dist') {
    dependsOn clean, jlinkZip
}

sonar {
    properties {
        property "sonar.projectKey", "mfl28_BoundingBoxEditor"
        property "sonar.organization", "mfl28"
    }
}

license {
    header = rootProject.file('gradle/LICENSE_HEADER')
    strictCheck = true

    mapping {
        scss = 'SLASHSTAR_STYLE'
        css = 'SLASHSTAR_STYLE'
        java = 'SLASHSTAR_STYLE'
    }

    excludes(['**/_*.scss', '**/styles.css', '**/testannotations/**/*', '**/testimages/**/*', '**/icons/*'])

    ext.year = currentYear
    ext.author = 'Markus Fleischhacker'
    ext.project = 'Bounding Box Editor'
    ext.email = 'markus.fleischhacker28@gmail.com'
}

