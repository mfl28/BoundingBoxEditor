name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - .dockerignore
      - .gitignore
      - Dockerfile
      - LICENSE
      - README.md
      - demo-media/*
      - chocolatey/**
  pull_request:
    branches:
      - master
  # Started by the Version Bump workflow for its pull request (pull requests opened by workflows run no checks).
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  TEST_SCREEN_WIDTH: '1920'
  TEST_SCREEN_HEIGHT: '1080'

jobs:
  Build-and-Test-Windows:
    runs-on: windows-latest
    name: Build and Test (Windows)
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build
        run: ./gradlew --info --stacktrace build -x test
      - name: Test setup
        run: |
          choco install -y change-screen-resolution
          changescreenresolution $TEST_SCREEN_WIDTH $TEST_SCREEN_HEIGHT
      - name: Test
        id: test
        run: ./gradlew --info --stacktrace test
      - name: Upload failed test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-screenshots-windows
          path: build/test-screenshots
      - name: Publish coverage report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        env:
          OS: Windows
        with:
          fail_ci_if_error: true
          directory: build/reports/
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS
      - name: Jpackage
        run: ./gradlew --info --stacktrace jpackage
      - name: Smoke-test packaged app
        run: ./gradlew --info --stacktrace packagedAppSmokeTest
      - name: Upload installer (exe)
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-installer-windows-exe
          path: build/jpackage/*.exe
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-portable-windows
          path: build/jpackage/BoundingBoxEditor
      - name: Stop Gradle daemons
        run: ./gradlew --stop

  Build-and-Test-Linux:
    runs-on: ubuntu-latest
    name: Build and Test (Linux)
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build
        run: ./gradlew --info --stacktrace build -x test
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Test setup
        run: |
          sudo apt-get update
          sudo apt-get install xvfb fluxbox
          Xvfb :10 -screen 0 ${TEST_SCREEN_WIDTH}x${TEST_SCREEN_HEIGHT}x24 &
          fluxbox -display :10 &
      - name: Test
        id: test
        run: DISPLAY=:10 ./gradlew --stacktrace --info test
      - name: Upload failed test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-screenshots-linux
          path: build/test-screenshots
      - name: Publish coverage report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        env:
          OS: Linux
        with:
          fail_ci_if_error: true
          directory: build/reports/
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS
      - name: Jpackage
        run: ./gradlew --info --stacktrace jpackage
      - name: Smoke-test packaged app
        # A fresh Gradle process: the daemon started during CodeQL's build tracing keeps injecting its Java agent into
        # the programs it runs, and the packaged runtime (without java.instrument) can't start with it.
        run: ./gradlew --no-daemon --info --stacktrace packagedAppSmokeTest
      - name: Upload installer (deb)
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-installer-linux-deb
          path: build/jpackage/*.deb
      - name: Upload installer (rpm)
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-installer-linux-rpm
          path: build/jpackage/*.rpm
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-portable-linux
          path: build/jpackage/BoundingBoxEditor
      - name: Sonarqube analysis
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew sonar '-Dsonar.host.url=https://sonarcloud.io'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Build-and-Test-macOS:
    runs-on: macos-latest
    name: Build and Test (macOS)
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build
        run: ./gradlew --info --stacktrace build -x test
      - name: Test
        id: test
        run: ./gradlew --info --stacktrace test
      - name: Publish coverage report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        env:
          OS: macOS
        with:
          fail_ci_if_error: true
          directory: build/reports/
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS
      - name: Jpackage
        run: ./gradlew --info --stacktrace jpackage
      - name: Smoke-test packaged app
        run: ./gradlew --info --stacktrace packagedAppSmokeTest
      - name: Upload installer (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-installer-macos-dmg
          path: build/jpackage/*.dmg
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: boundingboxeditor-portable-macos
          path: build/jpackage/BoundingBoxEditor.app
  Release:
    needs: [Build-and-Test-Windows, Build-and-Test-Linux, Build-and-Test-macOS]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Github Release
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        # The installers are named after build.gradle's version, so it must match the tag.
        run: |
          version="$(sed -nE "s/^version = '([^']+)'$/\1/p" build.gradle)"

          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version '$version' in build.gradle. Nothing was released."
            exit 1
          fi
      - name: Create changelog
        id: changelog
        run: |
          body_text="$(git log --no-merges --pretty=format:"* %H %s" $(git describe --tags --abbrev=0 @^)..@)"
          num_lines="$(echo "$body_text" | wc -l)"

          if [ "$num_lines" -gt "10" ]
          then
            body_text="$(echo "$body_text" | sed '10a<details><summary><b>See More</b></summary>\n')"
            body_text="$(echo "$body_text" | sed '$a\\n</details>')"
          fi

          body_text="$(echo "$body_text" | sed '1i## Changes:\n')"

          # A multiline output; the random delimiter can't occur in the commit messages.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$delimiter"
            echo "$body_text"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
      - name: Prepare artifacts
        run: |
          sudo apt-get update
          sudo apt-get install rename
          mv boundingboxeditor-installer-*/* .
          find "$PWD"/* -maxdepth 0 -type f -name "BoundingBoxEditor*" -exec basename {} ";" | rename -f 'y/A-Z/a-z/'
          for image_dir in $(find "$PWD"/* -maxdepth 0 -type d -name "boundingboxeditor-portable-*")
          do
            cd $image_dir
            zip -r $image_dir *
          done
      - name: Release to github
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            boundingboxeditor*.exe
            boundingboxeditor*.deb
            boundingboxeditor*.rpm
            boundingboxeditor*.dmg
            boundingboxeditor-portable-*.zip

  Chocolatey:
    needs: Release
    if: startsWith(github.ref, 'refs/tags/v')
    name: Chocolatey Release
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ github.ref_name }}
      publish: true
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  Version-Bump:
    needs: Release
    if: startsWith(github.ref, 'refs/tags/v')
    name: Version Bump
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-bump.yml
    with:
      tag: ${{ github.ref_name }}
